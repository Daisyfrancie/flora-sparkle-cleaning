{% extends "base.html" %}
{% block content %}
<section class="max-w-2xl mx-auto bg-white p-6 md:p-8 rounded-xl shadow border border-gray-100">
    <h2 class="text-3xl font-extrabold text-teal-800 mb-6">Book a Cleaning</h2>
    {% if services and slots %}
    <form method="POST" class="space-y-5">
        <div>
            <label for="service_id" class="block font-bold mb-1">Service</label>
            <select id="service_id" name="service_id" required class="w-full border rounded-lg p-3">
                {% for service in services %}
                <option value="{{ service.service_id }}">{{ service.name }} — KES {{ "%.2f"|format(service.price) }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label for="slot_id" class="block font-bold mb-1">Available time</label>
            <select id="slot_id" name="slot_id" required class="w-full border rounded-lg p-3">
                {% for slot in slots %}
                <option value="{{ slot.slot_id }}">{{ slot.slot_date }} at {{ slot.start_time }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label for="location" class="block font-bold mb-1">Cleaning location</label>
            <input id="location" type="text" name="location" required maxlength="150" class="w-full border rounded-lg p-3">
        </div>
        <div>
            <label for="payment_method" class="block font-bold mb-1">Payment method</label>
            <select id="payment_method" name="payment_method" required class="w-full border rounded-lg p-3">
                <option value="M-Pesa">M-Pesa</option>
                <option value="Cash">Cash</option>
            </select>
        </div>
        <button type="submit" class="bg-teal-700 text-white font-bold px-6 py-3 rounded-lg hover:bg-teal-800">Confirm Booking</button>
    </form>
    {% else %}
    <p class="text-gray-600">There are no services or available time slots at the moment.</p>
    {% endif %}
</section>
{% endblock %}
