services:
  - type: web
    name: flora-sparkle-cleaning
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python -c "from run import init_db; init_db()" && gunicorn run:app --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flora-sparkle-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true

databases:
  - name: flora-sparkle-db
    databaseName: flora_sparkle_db
    user: flora_sparkle_user
    plan: free
    region: frankfurt
